<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Conciertos, películas y shows: los que vienen y los que ya viviste." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Encore" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Encore</title>
    <script>
      /* Paint the background before the CSS/JS bundle loads so the
         home-screen launch never flashes white. */
      (function () {
        try {
          /* The design is dark-first, so dark is the default. */
          var dark = localStorage.getItem('concerts.theme') !== 'light'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.backgroundColor = dark ? '#000000' : '#f4f2f8'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.backgroundColor = '#000000'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
